[tool.poetry]
name = "langchain-ha-bridge"
version = "1.0.0"
description = "LangChain Router Agent for Home Assistant"
authors = ["Daniel Reissenberger <daniel.reissenberger@gmail.com>", "Jack Coy <jackman3000@gmail.com>"]
readme = "README.md"
packages = [{include = "langchain_agent"}]

[tool.poetry.dependencies]
python = ">=3.13.2,<3.14"
langchain = "^1.2.10"
openai = "^2.24.0"
ollama = "^0.6.1"
pyyaml = "^6.0"
voluptuous = "^0.15.2"
fastapi = "0.115.14"
uvicorn = "0.35.0"
homeassistant = "2025.11.3"
langchain-community = "^0.4.1"
langchain-openai = "^1.1.10"
langchain-ollama = "^1.0.1"
dotenv = "0.9.9"
langchain-tavily = "^0.2.7"
langgraph = "^1.0.10"
jsonschema = "^4.25.1"
websockets = "^15.0.1"
semantic-router = {extras = ["local"], version = "^0.1.12"}
transformers = "^4.57.5"
torch = "^2.9.1"
langsmith = "^0.7.9"
langgraph-cli = {extras = ["inmem"], version = "^0.4.12"}

[tool.poetry.scripts]
langchain-ha-bridge = "langchain_agent.src.__main__:main"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-asyncio = "^0.21.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
